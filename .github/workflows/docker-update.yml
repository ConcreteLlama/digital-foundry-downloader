name: Docker Update

on:
  push:
    branches:
    - main
    - develop
    - experimental

jobs:
  update-dockerhub:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract version from package.json
      id: version
      run: |
        VERSION=$(grep -m1 '"version"' package.json | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Set Docker image tags
      id: set_tags
      run: |
        if [ "${GITHUB_REF}" == "refs/heads/main" ]; then
          TAG="latest"
          VERSION_TAG="v${VERSION}"
        elif [ "${GITHUB_REF}" == "refs/heads/develop" ]; then
          TAG="development"
          VERSION_TAG="v${VERSION}-development"
        else
          TAG="experimental"
          VERSION_TAG="v${VERSION}-experimental"
        fi
        echo "TAG=${TAG}" >> $GITHUB_ENV
        echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV

    - name: Check whether this commit is already built under another tag
      # A promotion (experimental -> develop -> main) is usually a fast-forward
      # with no new commits, so the image that was already tested is byte-for-
      # byte what this push would build again - rebuilding just spends twenty
      # minutes reproducing it. imagetools create copies the existing manifest
      # onto the new tags without re-uploading a single layer.
      #
      # The git SHA matching is necessary but not sufficient: the candidate tag
      # has to actually exist and carry a `commit` label that agrees, in case
      # its own build failed, is still running, or predates this label being
      # added. Checked against the registry rather than trusted from git alone.
      #
      # Only main and develop are candidates for reuse - experimental is always
      # freshly built, since it is the branch this compares everything else
      # against.
      id: reuse
      if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
      run: |
        CANDIDATE=""
        if [ "${GITHUB_REF}" == "refs/heads/develop" ]; then
          CANDIDATE="experimental"
        elif [ "${GITHUB_REF}" == "refs/heads/main" ]; then
          CANDIDATE="development"
        fi
        SOURCE=""
        if [ -n "$CANDIDATE" ]; then
          LABEL=$(docker buildx imagetools inspect "${{ vars.DOCKERHUB_USERNAME }}/digital-foundry-downloader:${CANDIDATE}" --format '{{.Image.Config.Labels.commit}}' 2>/dev/null || true)
          if [ "$LABEL" == "${{ github.sha }}" ]; then
            SOURCE="$CANDIDATE"
            echo "Reusing $CANDIDATE - already built from this exact commit"
          else
            echo "Not reusing $CANDIDATE - its commit label is '$LABEL', this push is ${{ github.sha }}"
          fi
        fi
        echo "source_tag=$SOURCE" >> "$GITHUB_OUTPUT"

    - name: Re-tag the existing image rather than rebuilding it
      if: steps.reuse.outputs.source_tag != ''
      run: |
        docker buildx imagetools create \
          --tag ${{ vars.DOCKERHUB_USERNAME }}/digital-foundry-downloader:${{ env.TAG }} \
          --tag ${{ vars.DOCKERHUB_USERNAME }}/digital-foundry-downloader:${{ env.VERSION_TAG }} \
          ${{ vars.DOCKERHUB_USERNAME }}/digital-foundry-downloader:${{ steps.reuse.outputs.source_tag }}

    - name: Build and push Docker image
      if: steps.reuse.outputs.source_tag == ''
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ vars.DOCKERHUB_USERNAME }}/digital-foundry-downloader:${{ env.TAG }}
          ${{ vars.DOCKERHUB_USERNAME }}/digital-foundry-downloader:${{ env.VERSION_TAG }}
        labels: |
          version=${{ env.VERSION }}
          commit=${{ github.sha }}
        build-args: |
          GIT_BRANCH=${{ github.ref_name }}
          GIT_COMMIT=${{ github.sha }}
        # Without this every build recompiles whisper.cpp and re-runs npm ci
        # from nothing, because runners are ephemeral and no layer cache
        # survives between them.
        #
        # mode=max rather than the default: whisper is built in a separate
        # stage and only its artifacts are copied forward, so the default
        # (which caches only the layers of the final image) would not cache
        # the compile - the expensive part. The whisper stage now reduces to
        # ~16MB, so restoring it is close to free, and it is only rebuilt when
        # WHISPER_CPP_REF or the build command itself changes.
        #
        # The sibling scopes are not redundant. GitHub Actions isolates the
        # cache per branch, with one exception: any branch may read the
        # default branch's. Since experimental is not the default, its freshly
        # warmed cache was invisible to the main and develop builds that
        # followed a promotion - so both recompiled whisper.cpp from scratch,
        # minutes each, immediately after an identical compile had finished.
        # Naming the scopes explicitly lets each branch read the others'.
        cache-from: |
          type=gha
          type=gha,scope=experimental
          type=gha,scope=develop
          type=gha,scope=main
        cache-to: type=gha,mode=max